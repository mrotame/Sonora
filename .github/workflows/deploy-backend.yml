name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    # Only backend-relevant changes redeploy the service.
    paths:
      - 'server/**'
      - 'shared/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation (keyless auth)

env:
  # Repository variables (Settings > Secrets and variables > Actions > Variables)
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Builds the Dockerfile with Cloud Build and deploys the image.
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          source: .
          env_vars: |
            ALLOWED_ORIGIN=${{ vars.ALLOWED_ORIGIN }}
          # RapidAPI key read by Cloud Run from Secret Manager (secret `rapidapi-key`): audio comes from
          # the RapidAPI provider instead of yt-dlp, which YouTube blocks on Cloud Run IPs (ADR 0012).
          # The key never passes through GitHub. Without the variable (local runs) yt-dlp is used.
          secrets: |
            RAPIDAPI_KEY=rapidapi-key:latest
          flags: >-
            --allow-unauthenticated
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --timeout=120
            --cpu-boost
